<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awel Bawel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="stamp-label">Priority Intake — No Records Kept</div>
    <h1>Awel Bawel</h1>
    <div class="sub">sort what's left by how much it hurts to ignore it</div>
  </div>

  <div class="panel">
    <div class="panel-label">Weighting</div>
    <div class="slider-row">
      <div class="row-top"><span class="lbl">Time pressure</span><span class="val" id="timeVal">60%</span></div>
      <input type="range" id="timeSlider" min="0" max="100" value="60">
    </div>
    <div class="slider-row">
      <div class="row-top"><span class="lbl">Prep gap</span><span class="val" id="prepVal">40%</span></div>
      <input type="range" id="prepSlider" min="0" max="100" value="40">
    </div>
  </div>

  <div class="panel">
    <div class="panel-label">Intake</div>
    <div class="form-toggle">
      <button id="tabExam" type="button" class="active" aria-pressed="true">Exam</button>
      <button id="tabProject" type="button" aria-pressed="false">Project</button>
    </div>

    <div class="field">
      <label id="nameLabel" for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Linear Algebra">
    </div>
    <div class="field">
      <label id="daysLabel" for="daysInput">Days until exam — 0 = today/overdue</label>
      <input type="number" id="daysInput" min="0" value="3">
    </div>

    <div id="examFields" class="field">
      <label>Knowledge — 1 barely know it, 5 mastered</label>
      <div class="knowledge-btns" id="knowBtns">
        <button type="button" data-v="1" aria-pressed="false">1</button><button type="button" data-v="2" aria-pressed="false">2</button><button type="button" data-v="3" aria-pressed="true">3</button><button type="button" data-v="4" aria-pressed="false">4</button><button type="button" data-v="5" aria-pressed="false">5</button>
      </div>
    </div>
    <div id="projectFields" class="field" style="display:none;">
      <div class="row-top" style="font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;">
        <span>% complete</span><span id="completeVal" style="color:var(--ink);font-weight:600;">0%</span>
      </div>
      <input type="range" id="completeSlider" min="0" max="100" value="0">
    </div>

    <button id="addBtn" type="button">+ Add to Stack</button>
  </div>

  <div class="panel-label" style="margin:0 0 10px 2px;">Stack — highest priority first</div>
  <div id="list"></div>
  <div class="empty" id="emptyMsg">No tags yet. Add an exam or project above.</div>
</div>

<script src="script.js"></script>
</body>
</html>
